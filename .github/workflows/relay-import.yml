name: Import prepared RELAY starter

on:
  push:
    branches: [main]
    paths:
      - ".relay-import.ready"

permissions:
  contents: write

jobs:
  import-starter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract prepared starter
        shell: bash
        run: |
          set -euo pipefail
          for part in .relay-import.part01 .relay-import.part02 .relay-import.part03 .relay-import.part04 .relay-import.part05; do
            test -s "$part"
          done
          cat .relay-import.part01 .relay-import.part02 .relay-import.part03 .relay-import.part04 .relay-import.part05 | base64 --decode > /tmp/relay-starter.zip
          unzip -q /tmp/relay-starter.zip -d /tmp/relay-starter
          cp -a /tmp/relay-starter/relay-by-asivaro-starter/. .
          rm -f .relay-import.part01 .relay-import.part02 .relay-import.part03 .relay-import.part04 .relay-import.part05 .relay-import.ready
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Import RELAY Cloud Lab starter"
          git push
